{% extends 'console/base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>{{ form_title }}</h2> <!-- Passamos "Create VPN" ou "Edit VPN" na view -->
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'vendorvpn_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
